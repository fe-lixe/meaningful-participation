name: Publish release

# Publishes a tagged version's schemas, vocabularies and context to GitHub
# Pages under /<version>/ (SPECIFICATION.md section 28). A published version
# is never changed: re-running for an existing version fails.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release
        env:
          MPP_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --no-audit --no-fund
          npm run validate

      - name: Check out gh-pages
        run: |
          if git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi

      - name: Add version folder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -e "site/$VERSION" ]; then
            echo "::error::Version $VERSION is already published and cannot be changed."
            exit 1
          fi
          mkdir -p "site/$VERSION"
          for dir in schemas vocabularies context; do
            if [ -d "$dir" ]; then cp -r "$dir" "site/$VERSION/"; fi
          done
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish MPP $VERSION"
          git push origin gh-pages
