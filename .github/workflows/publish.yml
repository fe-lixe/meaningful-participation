name: Publish release

# Releases are tagged vMAJOR.MINOR.PATCH (SPECIFICATION.md section 28).
# vX.Y.0 publishes the artefacts for protocol version X.Y to GitHub Pages
# under /X.Y/; a published version is never changed. vX.Y.Z with Z > 0 is a
# patch release: it publishes nothing and fails if it changes artefacts.
# The legacy tag v1.0 is release 1.0.0.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plan release
        id: plan
        run: node scripts/release.mjs "$GITHUB_REF_NAME"

      - name: Validate release
        env:
          MPP_RELEASE_VERSION: ${{ steps.plan.outputs.protocol-version }}
        run: |
          npm install --no-audit --no-fund
          npm run validate

      - name: Check out gh-pages
        if: steps.plan.outputs.mode == 'publish'
        run: |
          if git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi

      - name: Add version folder
        if: steps.plan.outputs.mode == 'publish'
        env:
          VERSION: ${{ steps.plan.outputs.protocol-version }}
        run: |
          if [ -e "site/$VERSION" ]; then
            echo "::error::Version $VERSION is already published and cannot be changed."
            exit 1
          fi
          mkdir -p "site/$VERSION"
          for dir in schemas vocabularies context; do
            if [ -d "$dir" ]; then cp -r "$dir" "site/$VERSION/"; fi
          done
          touch site/.nojekyll

      - name: Commit and push
        if: steps.plan.outputs.mode == 'publish'
        working-directory: site
        env:
          VERSION: ${{ steps.plan.outputs.protocol-version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish MPP $VERSION"
          git push origin gh-pages
